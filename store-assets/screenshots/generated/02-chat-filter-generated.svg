<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>Generated promotional screenshot showing chat filtering</title>
  <defs>
    <linearGradient id="filter-right-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173054" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#173054" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#173054" stop-opacity="0.91"/>
    </linearGradient>
    <filter id="filter-shadow" x="-20%" y="-35%" width="140%" height="180%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#102a4f" flood-opacity="0.34"/>
    </filter>
    <filter id="filter-soft-shadow" x="-20%" y="-35%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#102a4f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <image href="./scene-rocket.png" x="0" y="0" width="1280" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect x="676" width="604" height="800" fill="url(#filter-right-shade)"/>

  <!-- Generated game hint -->
  <g filter="url(#filter-soft-shadow)">
    <rect x="55" y="44" width="770" height="75" rx="18" fill="#ffffff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="91" cy="81" r="22" fill="#2e5b9a"/>
    <text x="91" y="88" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">31</text>
    <text x="129" y="76" fill="#718096" font-size="11" font-weight="800" letter-spacing="1.6">GUESS THIS</text>
    <text x="129" y="101" fill="#132238" font-size="22" font-weight="800" letter-spacing="4.5">_ _ _ _ _ _</text>
    <text x="784" y="88" text-anchor="end" fill="#43556f" font-size="14" font-weight="700">Round 3 of 3</text>
  </g>

  <!-- Marketing copy -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="854" y="70" fill="#f5cf3f" font-size="14" font-weight="800" letter-spacing="2.3">FILTER BY CHAT</text>
    <text x="854" y="110" fill="#ffffff" font-size="34" font-weight="800">Type to narrow.</text>
    <text x="854" y="148" fill="#ffffff" font-size="34" font-weight="800">Find it instantly.</text>
    <text x="854" y="180" fill="#dfeaff" font-size="17" font-weight="600">Your input focuses the results in real time.</text>
  </g>

  <!-- Exact extension UI, filtered to one result -->
  <g filter="url(#filter-shadow)">
    <rect x="854" y="215" width="374" height="187" rx="12" fill="#ffffff" stroke="#d9dfe7"/>
  </g>
  <path d="M854 278h374" stroke="#e1e6ed"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="874" y="253" fill="#43556f" font-size="14" font-weight="800" letter-spacing="1.4">MATCHES</text>
    <text x="959" y="253" fill="#43556f" font-size="15" font-weight="500">1 match · English</text>
    <rect x="1093" y="238" width="18" height="18" rx="4" fill="#43556f"/>
    <path d="M1098 247l3 3 6-7" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
    <text x="1119" y="253" fill="#43556f" font-size="14">Filter by Chat</text>
  </g>
  <g filter="url(#filter-soft-shadow)">
    <rect x="874" y="300" width="116" height="50" rx="6" fill="#ffffff" stroke="#d9dfe7" stroke-width="1.5"/>
  </g>
  <text x="932" y="332" text-anchor="middle" fill="#132238" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">Rocket</text>
  <g transform="translate(1007 304)" font-family="Arial, Helvetica, sans-serif">
    <rect width="196" height="42" rx="21" fill="#eaf6e7"/>
    <circle cx="22" cy="21" r="8" fill="#5bcf4a"/>
    <path d="M18 21l3 3 6-7" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
    <text x="39" y="27" fill="#31643a" font-size="14" font-weight="800">50+ → 1 result</text>
  </g>

  <!-- Generated chat field and interaction cue -->
  <g filter="url(#filter-shadow)">
    <rect x="854" y="432" width="374" height="152" rx="12" fill="#ffffff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="854" y="432" width="374" height="40" rx="12" fill="#eef6ff"/>
    <path d="M854 460v12h374v-12" fill="#eef6ff"/>
    <text x="872" y="458" fill="#4386d8" font-size="14" font-weight="800">Nova is drawing now!</text>
    <rect x="870" y="493" width="342" height="58" rx="6" fill="#ffffff" stroke="#5aa1f2" stroke-width="2"/>
    <text x="885" y="529" fill="#132238" font-size="18" font-weight="700">roc</text>
    <rect x="919" y="514" width="2" height="20" fill="#2e5b9a"/>
  </g>
  <path d="M1039 423c0-11 0-17-1-23" fill="none" stroke="#f5cf3f" stroke-linecap="round" stroke-width="5"/>
  <path d="M1029 412l10 11 10-11" fill="none" stroke="#f5cf3f" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>

  <!-- Benefit chips -->
  <g font-family="Arial, Helvetica, sans-serif" filter="url(#filter-soft-shadow)">
    <g transform="translate(854 622)">
      <rect width="176" height="48" rx="24" fill="#ffffff"/>
      <circle cx="25" cy="24" r="9" fill="#f5cf3f"/>
      <path d="M20 24h10M25 19v10" stroke="#173054" stroke-linecap="round" stroke-width="2"/>
      <text x="44" y="31" fill="#173054" font-size="16" font-weight="800">Filter live</text>
    </g>
    <g transform="translate(1042 622)">
      <rect width="186" height="48" rx="24" fill="#ffffff"/>
      <circle cx="25" cy="24" r="9" fill="#5bcf4a"/>
      <path d="M21 24l3 3 6-7" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
      <text x="44" y="31" fill="#173054" font-size="16" font-weight="800">Click to submit</text>
    </g>
  </g>
  <g transform="translate(854 700)" font-family="Arial, Helvetica, sans-serif">
    <text fill="#dfeaff" font-size="15" font-weight="600">Fast for every round. Simple by design.</text>
  </g>
</svg>
